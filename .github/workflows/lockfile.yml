name: Lockfile Sync Check
on:
  pull_request:
    branches: [main]

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile || (echo "❌ Lockfile out of sync! Run 'pnpm install' locally and commit pnpm-lock.yaml" && exit 1)
