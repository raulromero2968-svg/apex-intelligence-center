name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Verify barrels
        run: pnpm --filter web verify-barrels

      - name: Verify schema sync
        run: pnpm --filter web exec tsx scripts/verify-schema-sync.ts

      - name: Schema check
        run: pnpm schema:check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Verify Drizzle syntax
        run: pnpm verify:drizzle-syntax

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter web build
        env:
          # Ensure Sentry DSN is available during build
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Create Sentry release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: production
          DEPLOY_URL: https://apexintelligence.io
        run: pnpm --filter web create-sentry-release

      - name: Deploy to Vercel (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          production: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .next/
            artifacts/
          retention-days: 7

      - name: Job summary
        if: always()
        run: |
          echo "## CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "**Node**: $(node -v)  **pnpm**: $(pnpm -v)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch**: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "✅ **Deployed to production**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "📋 **PR build - not deployed**" >> "$GITHUB_STEP_SUMMARY"
          fi
