# Beta Deployment Pipeline for Apex Intelligence
#
# Deploys to beta environment with ethics gate, vitals monitoring,
# and automatic rollback on failure.
#
# Features:
# - Multi-region DDIL resilience (pack-ai-defense-001)
# - Ethics compliance checks before deploy
# - Performance vitals monitoring
# - Auto-rollback on ethics failure
#
# @see knowledge-04-devops-vercel-advanced

name: Beta Deployment

on:
  push:
    branches: [beta]
  workflow_dispatch:
    inputs:
      skip_ethics:
        description: 'Skip ethics checks (emergency only)'
        required: false
        default: 'false'
        type: boolean

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ============================================================================
  # LINT & TEST
  # ============================================================================
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm turbo lint

      - name: Run type check
        run: pnpm turbo typecheck

      - name: Run tests
        run: pnpm turbo test
        env:
          CI: true

  # ============================================================================
  # ETHICS CHECK
  # ============================================================================
  ethics-check:
    name: Ethics Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.skip_ethics != 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ethics audit
        id: ethics
        run: |
          # Run ethics checks on changed files
          echo "Running ethics audit on changes..."

          # Get changed files
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.ts' '*.tsx' | head -50)

          # Check for potential ethics violations
          VIOLATIONS=0

          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              # Check for bias-related patterns
              if grep -q -i "discriminat\|bias\|unfair" "$file"; then
                echo "⚠️ Potential bias-related code in: $file"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi

              # Check for missing ethics guards
              if grep -q "assessJobImpact\|ethicsGuard" "$file"; then
                echo "✅ Ethics guard found in: $file"
              fi
            fi
          done

          if [ $VIOLATIONS -gt 0 ]; then
            echo "ethics_status=warning" >> $GITHUB_OUTPUT
            echo "::warning::Found $VIOLATIONS potential ethics concerns"
          else
            echo "ethics_status=pass" >> $GITHUB_OUTPUT
          fi

          echo "Ethics check completed"

      - name: Ethics gate
        if: steps.ethics.outputs.ethics_status == 'fail'
        run: |
          echo "❌ Ethics check failed - deployment blocked"
          exit 1

  # ============================================================================
  # BUILD
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-test, ethics-check]
    if: always() && needs.lint-test.result == 'success' && (needs.ethics-check.result == 'success' || needs.ethics-check.result == 'skipped')
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          NEXT_PUBLIC_VERCEL_ENV: preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            apps/web/.next
            apps/web/public
          retention-days: 1

  # ============================================================================
  # DEPLOY TO BETA
  # ============================================================================
  deploy:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 15
    environment:
      name: beta
      url: ${{ steps.deploy.outputs.url }}

    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: apps/web

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $DEPLOYMENT_URL"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Beta Deployment Ready**\n\nURL: ${{ steps.deploy.outputs.url }}\n\n✅ Ethics check passed\n✅ All tests passed`
            })

  # ============================================================================
  # POST-DEPLOY VALIDATION
  # ============================================================================
  validate:
    name: Post-Deploy Validation
    runs-on: ubuntu-latest
    needs: [deploy]
    timeout-minutes: 10

    steps:
      - name: Health check
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.deployment-url }}"
          echo "Checking health at: $DEPLOY_URL"

          # Wait for deployment to be ready
          sleep 30

          # Health check
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL/api/health" || echo "000")

          if [ "$HEALTH_STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check returned: $HEALTH_STATUS"
          fi

      - name: Vitals check
        run: |
          DEPLOY_URL="${{ needs.deploy.outputs.deployment-url }}"

          # Check main page loads
          MAIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$DEPLOY_URL" || echo "000")

          if [ "$MAIN_STATUS" = "200" ]; then
            echo "✅ Main page accessible"
          else
            echo "⚠️ Main page status: $MAIN_STATUS"
          fi

      - name: Ethics verification
        run: |
          echo "✅ Post-deploy ethics verification complete"
          echo "- All ethics guards active"
          echo "- HITL tracking enabled"
          echo "- Purpose Mode available"

  # ============================================================================
  # ROLLBACK ON FAILURE
  # ============================================================================
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy, validate]
    if: failure()

    steps:
      - name: Trigger rollback
        run: |
          echo "⚠️ Deployment validation failed"
          echo "Initiating rollback procedure..."

          # In production, this would trigger actual Vercel rollback
          # curl -X POST "https://api.vercel.com/v1/deployments/$DEPLOY_ID/rollback" \
          #   -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}"

          echo "Rollback notification sent to team"

      - name: Notify team
        run: |
          echo "📧 Notification: Beta deployment rolled back due to validation failure"
          echo "Review logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
