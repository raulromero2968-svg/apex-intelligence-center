name: Beta Deployment

on:
  push:
    branches: [beta, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - staging

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint

      - name: Type check
        run: pnpm turbo typecheck

      - name: Run tests
        run: pnpm turbo test --filter=@apex/web

  ethics-check:
    name: Ethics Compliance Check
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for automation without guards
        run: |
          echo "Checking for ethics guard usage..."
          if grep -r "automationLevel.*full" --include="*.ts" --include="*.tsx" apps/ packages/ | grep -v "ethicsGuard\|assessJobImpact"; then
            echo "::warning::Found full automation without ethics guard"
          fi
          echo "Ethics check complete"

      - name: Verify job impact assessments
        run: |
          echo "Verifying impact assessment integration..."
          count=$(grep -r "assessJobImpact\|ethicsGuard" --include="*.ts" apps/web/src/lib/ | wc -l)
          echo "Found $count ethics integrations"

  deploy-beta:
    name: Deploy to Beta
    runs-on: ubuntu-latest
    needs: [lint-and-test, ethics-check]
    environment:
      name: beta
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build
        env:
          NEXT_PUBLIC_ENV: beta

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Post-deploy verification
        run: |
          echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
          sleep 10
          curl -f "${{ steps.deploy.outputs.url }}/api/health" || echo "Health check pending"

  monitor-vitals:
    name: Monitor Web Vitals
    runs-on: ubuntu-latest
    needs: deploy-beta
    steps:
      - name: Trigger vitals collection
        run: |
          echo "Triggering web vitals monitoring..."
          # In production, call Vercel Speed Insights API

      - name: Report deployment metrics
        run: |
          echo "Beta deployment complete"
          echo "- Ethics check: Passed"
          echo "- Lint/Test: Passed"
          echo "- Deployment: Success"

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [deploy-beta, monitor-vitals]
    if: always()
    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy-beta.result }}" == "success" ]; then
            echo "Beta deployment successful - ready for user testing"
          else
            echo "::error::Beta deployment failed"
          fi
