    steps:
      - name: 📊 Generate Final Report
        run: |
          echo ""
          echo "█████████████████████████████████████████████████████████████████"
          echo "█                                                               █"
          echo "█                  APEX CONSTITUTION                            █"
          echo "█                  FINAL VERDICT                                █"
          echo "█                                                               █"
          echo "█████████████████████████████████████████████████████████████████"
          echo ""
          echo "Launch Date: January 1, 2026"
          echo "Today: $(date '+%B %d, %Y')"
          echo ""
          echo "Mission Statement:"
          echo "  The only TCG platform that will NEVER destroy a family."
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "Gate Results:"
          echo ""
          echo "  Gate 1: Core Ethics (8 Checks)       ${{ needs.core-ethics.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "  Gate 2: Family Protection (8 Rules)  ${{ needs.family-protection.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "  Gate 3: FOMO Language Scanner         ${{ needs.fomo-scanner.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "  Gate 4: Payment Route Security        ${{ needs.payment-security.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo "  Gate 5: Reality Check Modal           ${{ needs.reality-check.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo ""

      - name: ✅ Verdict - ALL CHECKS PASSED
        if: |
          needs.core-ethics.result == 'success' &&
          needs.family-protection.result == 'success' &&
          needs.fomo-scanner.result == 'success' &&
          needs.payment-security.result == 'success' &&
          needs.reality-check.result == 'success'
        run: |
          echo "█████████████████████████████████████████████████████████████████"
          echo "█                                                               █"
          echo "█                  ✅ VERDICT: APPROVED                         █"
          echo "█                                                               █"
          echo "█████████████████████████████████████████████████████████████████"
          echo ""
          echo "🎉 All ethical checks passed."
          echo "🛡️  Code meets the Apex Constitution standards."
          echo "🚀 This PR is safe to merge."
          echo ""
          echo "This code will protect families."
          echo "This code will prevent financial ruin."
          echo "This code upholds our values."
          echo ""
          echo "You are building something that matters."
          echo ""
          echo "This is Apex."
          echo ""

      - name: ❌ Verdict - VIOLATIONS DETECTED
        if: |
          needs.core-ethics.result != 'success' ||
          needs.family-protection.result != 'success' ||
          needs.fomo-scanner.result != 'success' ||
          needs.payment-security.result != 'success' ||
          needs.reality-check.result != 'success'
        run: |
          echo "█████████████████████████████████████████████████████████████████"
          echo "█                                                               █"
          echo "█                  ❌ VERDICT: REJECTED                         █"
          echo "█                                                               █"
          echo "█████████████████████████████████████████████████████████████████"
          echo ""
          echo "🚫 One or more ethical violations detected."
          echo "🔒 This PR is BLOCKED and cannot be merged."
          echo ""
          echo "Failed Gates:"
          if [ "${{ needs.core-ethics.result }}" != "success" ]; then
            echo "  ❌ Core Ethics (8 Checks)"
          fi
          if [ "${{ needs.family-protection.result }}" != "success" ]; then
            echo "  ❌ Family Protection (8 Rules)"
          fi
          if [ "${{ needs.fomo-scanner.result }}" != "success" ]; then
            echo "  ❌ FOMO Language Scanner"
          fi
          if [ "${{ needs.payment-security.result }}" != "success" ]; then
            echo "  ❌ Payment Route Security"
          fi
          if [ "${{ needs.reality-check.result }}" != "success" ]; then
            echo "  ❌ Reality Check Modal"
          fi
          echo ""
          echo "─────────────────────────────────────────────────────────────────"
          echo ""
          echo "The Apex Constitution is non-negotiable."
          echo ""
          echo "We will NOT:"
          echo "  - Manipulate users with FOMO"
          echo "  - Allow unlimited spending without breaks"
          echo "  - Ship code that could destroy a family"
          echo "  - Compromise our values for faster shipping"
          echo ""
          echo "Fix ALL violations. Then we ship."
          echo ""
          echo "This is Apex."
          echo ""
          exit 1
