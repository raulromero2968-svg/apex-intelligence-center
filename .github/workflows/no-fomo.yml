name: 🚫 FOMO Language Ban

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['**']

jobs:
  fomo-check:
    name: Enforce FOMO Language Ban
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FOMO Language Check (Script)
        run: pnpm check:fomo
        continue-on-error: true
        id: script-check

      - name: Run ESLint FOMO Check
        run: pnpm lint
        continue-on-error: true
        id: eslint-check

      - name: Report Results
        if: steps.script-check.outcome == 'failure' || steps.eslint-check.outcome == 'failure'
        run: |
          echo "❌ FOMO LANGUAGE DETECTED - BUILD BLOCKED"
          echo ""
          echo "The following FOMO phrases are permanently banned:"
          echo "  - limited time"
          echo "  - ending soon"
          echo "  - last chance"
          echo "  - act now"
          echo "  - don't miss"
          echo "  - only X left"
          echo "  - few remaining"
          echo "  - flash sale"
          echo "  - urgent"
          echo ""
          echo "❌ PRs cannot merge with FOMO copy. Ever."
          echo ""
          exit 1

      - name: Success Message
        if: steps.script-check.outcome == 'success' && steps.eslint-check.outcome == 'success'
        run: |
          echo "✅ No FOMO language detected. Build can proceed."
          echo "✅ Codebase remains free of manipulative urgency language."
