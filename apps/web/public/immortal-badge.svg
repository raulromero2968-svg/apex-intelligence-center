<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <!-- Gradient for the infinity symbol -->
    <linearGradient id="infinityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for the infinity symbol -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shine effect -->
    <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="200" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="596" height="196" rx="10" fill="none" stroke="url(#infinityGradient)" stroke-width="2" opacity="0.5"/>
  
  <!-- Infinity symbol (centered) -->
  <g transform="translate(300, 100)">
    <path d="M -60,0 
             C -60,-33 -33,-60 0,-60 
             C 33,-60 60,-33 60,0 
             C 60,33 33,60 0,60 
             C -33,60 -60,33 -60,0 
             Z
             M 60,0 
             C 60,-33 87,-60 120,-60 
             C 153,-60 180,-33 180,0 
             C 180,33 153,60 120,60 
             C 87,60 60,33 60,0 
             Z
             M -180,0 
             C -180,-33 -153,-60 -120,-60 
             C -87,-60 -60,-33 -60,0 
             C -60,33 -87,60 -120,60 
             C -153,60 -180,33 -180,0 
             Z" 
          fill="url(#infinityGradient)" 
          filter="url(#glow)"
          opacity="0.9"/>
  </g>
  
  <!-- Main title -->
  <text x="300" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    Apex Intelligence
  </text>
  
  <!-- Subtitle -->
  <text x="300" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Production Equilibrium Achieved
  </text>
  
  <!-- Date -->
  <text x="300" y="168" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="middle">
    November 19, 2025
  </text>
  
  <!-- Shine overlay -->
  <rect width="600" height="200" rx="12" fill="url(#shineGradient)" opacity="0.3"/>
</svg>

