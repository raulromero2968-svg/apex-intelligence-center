<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Value Calculator - Apex Intelligence</title>
    <link rel="icon" type="image/png" href="apex-intelligence-wolf-logo-transparent.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --apex-cyan: #00D9FF;
            --apex-purple: #9333EA;
            --bg-dark: #0a0e1a;
            --bg-card: rgba(20, 20, 30, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(147, 51, 234, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(0, 217, 255, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--apex-cyan), var(--apex-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
        }

        .calculator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .trade-side {
            background: var(--bg-card);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 2rem;
        }

        .side-title {
            font-size: 1.3rem;
            color: var(--apex-cyan);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .card-input {
            margin-bottom: 1rem;
        }

        .card-input input {
            width: 65%;
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            margin-right: 0.5rem;
        }

        .card-input input[type="number"] {
            width: 30%;
        }

        button {
            padding: 0.75rem 1.5rem;
            background: var(--apex-cyan);
            color: var(--bg-dark);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: white;
        }

        .add-card-btn {
            width: 100%;
            margin-top: 1rem;
        }

        .total-value {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 217, 255, 0.1);
            border-radius: 12px;
            margin-top: 1rem;
        }

        .result {
            background: var(--bg-card);
            border: 2px solid var(--apex-cyan);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .result h2 {
            color: var(--apex-cyan);
            margin-bottom: 1rem;
        }

        .result-value {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 1rem 0;
        }

        .result-value.fair {
            color: #00ff00;
        }

        .result-value.unfair {
            color: #ff4444;
        }

        .card-list {
            margin-top: 1rem;
        }

        .card-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(0, 217, 255, 0.1);
        }

        @media (max-width: 768px) {
            .calculator-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header">
            <h1>💱 Trade Value Calculator</h1>
            <p class="subtitle">Calculate fair trade values with market pricing</p>
        </div>

        <div class="calculator-grid">
            <div class="trade-side">
                <h2 class="side-title">Your Cards</h2>
                <div id="yourCards" class="card-list"></div>
                <div class="card-input">
                    <input type="text" id="yourCardName" placeholder="Card name" />
                    <input type="number" id="yourCardValue" placeholder="Value" />
                </div>
                <button class="add-card-btn" onclick="addCard('your')">+ Add Card</button>
                <div class="total-value">
                    Total: $<span id="yourTotal">0</span>
                </div>
            </div>

            <div class="trade-side">
                <h2 class="side-title">Their Cards</h2>
                <div id="theirCards" class="card-list"></div>
                <div class="card-input">
                    <input type="text" id="theirCardName" placeholder="Card name" />
                    <input type="number" id="theirCardValue" placeholder="Value" />
                </div>
                <button class="add-card-btn" onclick="addCard('their')">+ Add Card</button>
                <div class="total-value">
                    Total: $<span id="theirTotal">0</span>
                </div>
            </div>
        </div>

        <div class="result">
            <h2>Trade Analysis</h2>
            <div class="result-value" id="resultText">Add cards to analyze trade</div>
            <p id="resultDetail" style="color: var(--text-secondary); margin-top: 1rem;"></p>
        </div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="tools.html" style="color: var(--apex-cyan); text-decoration: none;">← Back to Tools</a>
        </div>
    </div>

    <script>
        let yourCards = [];
        let theirCards = [];

        function addCard(side) {
            const nameInput = document.getElementById(`${side}CardName`);
            const valueInput = document.getElementById(`${side}CardValue`);

            const name = nameInput.value.trim();
            const value = parseFloat(valueInput.value) || 0;

            if (name && value > 0) {
                const card = { name, value };

                if (side === 'your') {
                    yourCards.push(card);
                } else {
                    theirCards.push(card);
                }

                updateDisplay();
                nameInput.value = '';
                valueInput.value = '';
            }
        }

        function removeCard(side, index) {
            if (side === 'your') {
                yourCards.splice(index, 1);
            } else {
                theirCards.splice(index, 1);
            }
            updateDisplay();
        }

        function calculateTotal(cards) {
            return cards.reduce((sum, card) => sum + card.value, 0);
        }

        function updateDisplay() {
            // Update your cards list
            const yourCardsDiv = document.getElementById('yourCards');
            yourCardsDiv.innerHTML = yourCards.map((card, index) => `
                <div class="card-item">
                    <span>${card.name}</span>
                    <span>
                        $${card.value.toFixed(2)}
                        <button onclick="removeCard('your', ${index})" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.8rem;">✕</button>
                    </span>
                </div>
            `).join('');

            // Update their cards list
            const theirCardsDiv = document.getElementById('theirCards');
            theirCardsDiv.innerHTML = theirCards.map((card, index) => `
                <div class="card-item">
                    <span>${card.name}</span>
                    <span>
                        $${card.value.toFixed(2)}
                        <button onclick="removeCard('their', ${index})" style="margin-left: 0.5rem; padding: 0.25rem 0.5rem; font-size: 0.8rem;">✕</button>
                    </span>
                </div>
            `).join('');

            // Calculate totals
            const yourTotal = calculateTotal(yourCards);
            const theirTotal = calculateTotal(theirCards);

            document.getElementById('yourTotal').textContent = yourTotal.toFixed(2);
            document.getElementById('theirTotal').textContent = theirTotal.toFixed(2);

            // Update result
            const difference = Math.abs(yourTotal - theirTotal);
            const percentage = yourTotal > 0 ? (difference / yourTotal) * 100 : 0;

            const resultText = document.getElementById('resultText');
            const resultDetail = document.getElementById('resultDetail');

            if (yourTotal === 0 && theirTotal === 0) {
                resultText.textContent = 'Add cards to analyze trade';
                resultText.className = 'result-value';
                resultDetail.textContent = '';
            } else if (percentage < 10) {
                resultText.textContent = '✓ FAIR TRADE';
                resultText.className = 'result-value fair';
                resultDetail.textContent = `Values are within ${percentage.toFixed(1)}% of each other. This is a balanced trade!`;
            } else {
                const favoring = yourTotal > theirTotal ? 'favors you' : 'favors them';
                resultText.textContent = '⚠️ UNBALANCED';
                resultText.className = 'result-value unfair';
                resultDetail.textContent = `Difference: $${difference.toFixed(2)} (${percentage.toFixed(1)}%). Trade ${favoring}.`;
            }
        }

        // Allow Enter key to add cards
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                if (document.activeElement.id.includes('your')) {
                    addCard('your');
                } else if (document.activeElement.id.includes('their')) {
                    addCard('their');
                }
            }
        });
    </script>
</body>
</html>
